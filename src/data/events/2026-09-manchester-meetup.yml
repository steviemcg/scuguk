title: Manchester Sitecore Meetup - September 2026
excerpt: Join us for an informal meetup. Have a drink and chat all things Sitecore.
intro: >
  <p>Rather than a formal "listen to talks" type user group, we thought we'd try something different for a change. Come and join us in <b><i>Northern Monk Refectory</i></b> on Tarrif St, for a very informal chat and a drink.</p>
  <p>Bring your questions and opinions about anything Sitecore related:</p>
  <ul>
    <li>Maybe about what Scrunch is and why Sitecore bought it?</li>
    <li>What's interesting about release of v10.5 and the DXP's future'?</li>
    <li>Your thoughts on what sort of user group events you're interested in.</li>
    <li>Vent for sympathy about your project challenges!</li>
    <li>Or just bring your sparkling wit...</li>
  </ul>
  <p>All welcome, all topics accepted.</p>
  <p>Depending on whether there's a bunch of sign-ups, we might book a table or two. But the basic plan is to sit about and chat about whatever people want, rather than do anything organised.</p>
