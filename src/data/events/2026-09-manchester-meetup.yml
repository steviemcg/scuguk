title: Manchester Sitecore Meetup - September 2026
excerpt: Join us for an informal meetup. Have a drink and chat all things Sitecore.
intro: >
  <p>Rather than a formal "listen to talks" type user group, we thought we'd try something different for a change... Come and join us in <b><i>{{name of venue}}</i></b> for a very informal chat and a drink.</p>
  <p>Bring your questions about anything Sitecore related. Maybe about what Scrunch is, and why Sitecore bought it? Or what's coming with the release of v10.5? Or bring your thoughts on what sort of user group events you're interested in. Vent for sympathy about your project challenges. Or just bring your sparkling wit. All welcome, all topics accepted.</b></p>
  <p>Depending on whether there's a bunch of sign-ups, we might book a table or two. But the basic plan is to sit about and chat, rather than do anything organised.</p>
