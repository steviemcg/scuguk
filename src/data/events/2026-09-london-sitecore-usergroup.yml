eventId: febafa73-3c73-4d49-bbda-fe6cf08d1487
title: London Sitecore User Group - September 2026
excerpt: >
  We've got AI. We've got optimisation. We've got sociaising. It's all going on at the London Sitecore user group on the 24th September.
intro: >
  <p>
    Come and join us at Sitecore's latest office space near Paddington in London, for a meetup with a wide spread of content.
    We've got AI thoughts from outside our community, details on how you can make use of the data Sitecore already has to guide
    optimisations, plus a third thing to be announced nearer the time.
  </p>
  <p>
    Plus the usual pizza and drinks, and the chance to chat to other community members about what's important or challenging
    for your work right now.
  </p>
  <p>
    Hope we'll see you there...
  </p>
