title: London Sitecore Usergroup - November 2026
excerpt: Join us at Macmillan's office in near Southwark Bridge this November, for an evening of networking and talks.
intro: >
  Join us at Macmillan's office in near Southwark Bridge this November, for an evening of
  networking and talks. We have sessions lined up from a group of community luminaries, and
  we have a slot going spare if you have something <i>you</i> would like to talk about.
  <br/> &nbsp; <br/> 
  But whether you have an idea or not, stick the date in your diary, as we'd love to see you
  there.
